<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="same-origin">
  <meta name="description" content="查看 idore Agent 生成的影片、生成时间和 TikTok 沙盒投递进度。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://yjr927.github.io; media-src 'self' https://yjr927.github.io; connect-src 'self' https://yjr927.github.io; base-uri 'none'; form-action 'none'">
  <title>idore · Agent 成片库</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./gallery.css?v=studio-1">
  <link rel="stylesheet" href="./studio-shell.css?v=1">
  <script defer src="./gallery.js?v=studio-1"></script>
</head>
<body>
  <header class="idore-header">
    <a class="idore-brand" href="./" aria-label="idore 首页"><span><img src="./idore-wordmark.png" alt="idore"></span></a>
    <nav class="idore-nav" aria-label="工作台"><a aria-current="page" href="./gallery.html">成片</a><a href="./script-agent/">剧本角色</a></nav>
  </header>
  <main class="frame">
    <section id="verification-status" class="verification-banner" aria-label="云端采集需要人工验证" hidden>
      <div><strong>采集等待人工验证</strong><p><span id="verification-observed"></span>（纽约）</p></div>
      <button class="control" id="verification-open" type="button">查看步骤</button>
    </section>
    <dialog id="verification-dialog" aria-labelledby="verification-title" aria-describedby="verification-instructions verification-note">
      <h2 id="verification-title">需要人工验证</h2>
      <p id="verification-instructions">在 ChatGPT Work 的定时任务「idore 每日 TikTok 视频发现」中打开这次运行，回到原来的 TikTok 页面完成验证。</p>
      <p id="verification-note">确认后关闭提醒。云端采集更新时，状态会自动刷新。</p>
      <button class="control primary" type="button" id="verification-confirm" autofocus>Confirm</button>
    </dialog>
    <div class="dashboard-hero">
      <div class="heading"><h1>TikTok<br><em>成片库</em></h1></div>
    <section class="connection" aria-label="TikTok 沙盒连接">
      <div><h2><span id="connection-light" class="light"></span>TikTok 沙盒 <span id="account" class="account"></span></h2><p id="connection-message">查看账号回执与自动投递。</p></div>
      <a id="connection-link" class="control primary" href="https://idore-tools.yjr927.workers.dev/gallery.html">进入沙盒 ↗</a>
      <button id="automation-button" class="control" type="button" hidden></button>
    </section>
    </div>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <div class="workspace">
      <section id="films" class="collection" aria-labelledby="collection-heading">
        <div class="section-heading"><h2 id="collection-heading">所有成片 <span id="collection-count" class="count">—</span></h2><button id="refresh" class="control" type="button">刷新</button></div>
        <div id="gallery-grid" class="gallery-grid" aria-busy="true"><p class="empty">正在读取成片…</p></div>
      </section>
      <aside id="activity" aria-labelledby="activity-heading">
        <div class="section-heading"><h2 id="activity-heading">运行记录</h2><span class="timezone">纽约时间</span></div>
        <div id="activity-list"><p class="empty">正在读取记录…</p></div>
        <details class="criteria"><summary>选片条件</summary><p>至少 100 万播放、10 万赞，并核验 2 位其他创作者的同玩法原片。</p></details>
      </aside>
    </div>
  </main>
  <footer class="frame"><a href="./discovery.html">趋势库</a><a href="./privacy.html">隐私政策</a><a href="./terms.html">服务条款</a></footer>
  <noscript><p>请启用 JavaScript 以播放成片和查看实时状态。</p></noscript>
</body>
</html>
