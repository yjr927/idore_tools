<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="same-origin">
  <meta name="description" content="查看 idore Agent 生成的影片、生成时间和 TikTok 沙盒投递进度。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://yjr927.github.io; media-src 'self' https://yjr927.github.io; connect-src 'self' https://yjr927.github.io; base-uri 'none'; form-action 'none'">
  <title>idore · Agent 成片库</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./gallery.css?v=agent-library-1">
  <script defer src="./gallery.js?v=agent-library-1"></script>
</head>
<body>
  <header class="header">
    <div class="frame topbar">
      <a class="brand" href="./" aria-label="idore 首页"><img src="./mark.svg" width="35" height="35" alt=""><span>idore</span></a>
      <nav aria-label="工作空间"><a href="#films" aria-current="page">成片库</a><a href="#activity">运行记录</a></nav>
    </div>
  </header>
  <main class="frame">
    <div class="heading">
      <div><h1>Agent 成片库</h1><p>Agent 每天在纽约时间 09:17 和 18:17 定时从角色库选图、串剪成片。</p></div>
      <button id="refresh" class="control" type="button">刷新状态</button>
    </div>
    <section class="connection" aria-label="TikTok 沙盒连接">
      <div><h2><span id="connection-light" class="light"></span>TikTok 沙盒 <span id="account" class="account"></span></h2><p id="connection-message">打开沙盒工作台，查看当前账号的投递回执。</p></div>
      <a id="connection-link" class="control primary" href="https://idore-tools.yjr927.workers.dev/gallery.html">打开沙盒工作台 ↗</a>
      <button id="automation-button" class="control" type="button" hidden></button>
    </section>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <div class="workspace">
      <section id="films" class="collection" aria-labelledby="collection-heading">
        <div class="section-heading"><h2 id="collection-heading">所有成片 <span id="collection-count" class="count">—</span></h2><span class="timezone">纽约时间</span></div>
        <div id="gallery-grid" class="gallery-grid" aria-busy="true"><p class="empty">正在读取成片…</p></div>
      </section>
      <aside id="activity" aria-labelledby="activity-heading">
        <div class="section-heading"><h2 id="activity-heading">运行记录</h2><span class="timezone">纽约时间</span></div>
        <div id="activity-list"><p class="empty">正在读取最新记录…</p></div>
      </aside>
    </div>
  </main>
  <footer class="frame"><a href="./discovery.html">趋势素材</a><a href="./privacy.html">隐私政策</a><a href="./terms.html">服务条款</a></footer>
  <noscript><p>请启用 JavaScript 以播放成片和查看实时状态。</p></noscript>
</body>
</html>
