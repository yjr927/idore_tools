name: Generate KAI with chosen Bizzyboom motion reference
run-name: KAI - selected image plus 6-second motion reference
on:
  push:
    branches: [codex/kai-bizzyboom-cloud-20261115]
    paths: [.github/workflows/kai-bizzyboom-once.yml]
permissions:
  contents: read
concurrency:
  group: kai-bizzyboom-one-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the public-player browser
        run: |
          python3 -m pip install -r requirements-cloud.txt
          python3 -m playwright install --with-deps chromium
      - name: Read the public player in memory and generate one KAI video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAI_ALLOW_PAID: 'true'
          VIDEO_OUTPUT_DIR: generation-output
        run: python3 scripts/run_kai_motion_cloud.py
      - name: Save KAI video and safe status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-motion-result-${{ github.run_id }}
          path: |
            generation-output/generated/*.mp4
            generation-output/generation-summary.json
            generation-output/cloud-generation-summary.json
          retention-days: 7
          if-no-files-found: ignore
