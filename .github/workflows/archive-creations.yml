name: Archive completed video creations

on:
  workflow_run:
    workflows: ['Generate Seedance video', 'Generate outfit images, video or English copy']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  archive:
    if: >-
      contains(fromJSON('["success","failure","cancelled"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: permanent-creations-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.archive.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify and preserve only completed video output
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name "idore creations bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/archive_generated_videos.py --run-id "$SOURCE_RUN_ID" --site site
            if [ ! -f site/data/creations.json ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -f -- site/generated site/data/creations.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Archive completed video creation"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'Archive push did not complete; no video generation was invoked.'
          exit 1

  deploy:
    needs: archive
    # A retry must also publish a prior archive commit whose deployment failed.
    if: needs.archive.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge the same current Work data used by the trend viewer
        run: |
          python scripts/import_work_results.py --input work-results/latest.json --output site/data/discovery.json
          python scripts/import_material_classifications.py --input work-results/classifications.json --output site/data/discovery.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish creations with the viewer
        id: deployment
        uses: actions/deploy-pages@v4
