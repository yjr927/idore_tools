name: Read-only named video lookup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-named-video-lookup.yml'
      - 'scripts/reconcile_named_video_lookup.py'
permissions:
  contents: read
jobs:
  lookup:
    if: github.repository == 'yjr927/idore_tools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/reconcile_named_video_lookup.py
          sparse-checkout-cone-mode: false
      - name: Check the existing reservations
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -IB scripts/reconcile_named_video_lookup.py
