name: One-time OpenAI and Seedance generation check
run-name: One-time API test - English copy and 5-second video
on:
  push:
    branches: [codex/api-key-smoke-20261115]
    paths: [.github/workflows/api-smoke-generate.yml]
permissions:
  contents: read
concurrency:
  group: api-generation-smoke-20261115
  cancel-in-progress: false
jobs:
  english-copy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate one English caption and hashtag draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CREATIVE_OUTPUT_DIR: generation-output
          CREATIVE_INPUTS: >-
            {"task":"draft","model":"gpt-4.1-mini","character":"Original friendly cartoon deer mascot","description":"Public API connection test: a planned five-second vertical video of an original friendly cartoon deer mascot smiling and gently waving once, centered against a plain pastel background. Static camera, one continuous shot, soft even lighting, no text or logos. This draft uses this description only; no finished video was analyzed.","search_trends":false,"allow_paid":true}
        run: python3 scripts/run_creative_generation.py
      - name: Save English draft and safe status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-english-copy-${{ github.run_id }}
          path: |
            generation-output/publication-draft.json
            generation-output/creative-summary.json
          retention-days: 7
          if-no-files-found: ignore
  short-video:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exactly one five-second Seedance video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIDEO_OUTPUT_DIR: generation-output
          GENERATION_INPUTS: >-
            {"model":"bytedance/seedance-2.0-fast","mode":"text","prompt":"An original friendly stylized deer mascot stands centered against a plain pastel background, smiles and gently waves once. Static camera, one continuous shot, subtle smooth motion, soft even lighting. No text, logos or other characters.","duration":"5","resolution":"720p","allow_paid":true}
        run: python3 scripts/run_video_generation.py
      - name: Save MP4 and safe recovery status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-short-video-${{ github.run_id }}
          path: |
            generation-output/generated/*.mp4
            generation-output/generation-summary.json
          retention-days: 7
          if-no-files-found: ignore
