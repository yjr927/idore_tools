name: Backfill completed creations once
on:
  push:
    branches: [codex/generated-video-gallery-20261115]
    paths: [.github/workflows/backfill-creations-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/generated-video-gallery-20261115
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure video validation tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Preserve the two approved completed videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/archive_generated_videos.py --run-id 43772946438 --historical --site site
          python scripts/archive_generated_videos.py --run-id 43790641550 --historical --site site
      - name: Commit only final videos, posters and the public gallery index
        run: |
          git config user.name "idore creations bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- site/generated site/data/creations.json
          if ! git diff --cached --quiet; then
            git commit -m "Permanently archive completed KAI and deer videos"
            git push origin HEAD:codex/generated-video-gallery-20261115
          fi
      - name: Retain the public archive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permanent-creations-index
          path: site/data/creations.json
          if-no-files-found: warn
          retention-days: 7
