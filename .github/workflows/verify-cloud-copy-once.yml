name: Verify GitHub-secret captions once
on:
  push:
    branches: [codex/cloud-production-20261116]
    paths: [.github/workflows/verify-cloud-copy-once.yml]
permissions:
  contents: write
concurrency:
  group: idore-copy-validation-once
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloud-production-20261116
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate copy and review gates
        run: python -m unittest discover -s tests -p 'test_pipeline*.py' -v
      - name: Verify frame tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify secrets and generate copy for the existing KAI video once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          PIPELINE_PERSIST: 'true'
          PIPELINE_BRANCH: codex/cloud-production-20261116
        run: |
          python - <<'PY'
          import json, os
          from scripts.run_pipeline import main, STATE
          run = os.environ['GITHUB_RUN_ID']
          os.environ['PIPELINE_INPUTS'] = json.dumps({'action':'check','request_id':'check-'+run})
          main()
          item = next(i for i in json.loads(STATE.read_text())['items'] if i['id']=='review-video-36dc967ec3fc7e4cd1060f94')
          os.environ['PIPELINE_INPUTS'] = json.dumps({'action':'copy','item_id':item['id'],'revision':item['revision'],'request_id':'copy-'+run})
          raise SystemExit(main())
          PY
      - name: Retain public result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-copy-result
          path: site/data/pipeline.json
          retention-days: 7
