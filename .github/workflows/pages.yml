name: Publish trend viewer
on:
  push:
    branches: [main]
    paths: ['site/**', 'work-results/latest.json', 'scripts/import_work_results.py', 'tests/test_work_results.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['TikTok public discovery']
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Work data handling
        run: python3 -m unittest discover -s tests -p 'test_work_results.py' -v
      - name: Merge latest Work observations into viewer
        run: python3 scripts/import_work_results.py --input work-results/latest.json --output site/data/discovery.json
      - name: Preserve validated observations
        run: |
          git config user.name "idore discovery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- site/data/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Save validated Work video observations"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy viewer
        id: deployment
        uses: actions/deploy-pages@v4
